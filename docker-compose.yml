version: '3.8'

services:
  streamlit:
    build: .
    command: streamlit run main.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    networks:
      - guardrails-network

  modelserv:
    build: .
    command: python -m uvicorn modelserv:app --host 0.0.0.0 --port 8765
    ports:
      - "8765:8765"
    volumes:
      - ./logs:/app/logs
    networks:
      - guardrails-network

  guardserver:
    build: .
    command: python -m uvicorn guardserver:app --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - guardrails-network

networks:
  guardrails-network:
    driver: bridge